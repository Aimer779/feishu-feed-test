name: AI Daily Hourly Bot

on:
  schedule:
    # 每小时运行一次（UTC）；具体平台是否执行由 delivery.py 判断
    # GitHub Actions 有 5-15 分钟延迟，属于正常范围
    - cron: "0 * * * *"
  workflow_dispatch:  # 支持手动触发（方便测试）

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false  # 防止同时运行多个实例

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Shanghai  # 日志显示东八区时间
      PYTHONUTF8: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run hourly bot
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
        run: python hourly_bot.py

      - name: Upload preview artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hourly-preview-${{ github.run_id }}
          path: tmp/hourly_bot_*_preview.json
          retention-days: 7
